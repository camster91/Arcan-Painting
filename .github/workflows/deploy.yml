name: Build, Test & Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test -- --run
        env:
          CI: true

      - name: Trigger Coolify Deployment
        id: deploy
        run: |
          echo "Triggering Coolify redeploy for $COOLIFY_APP_UUID"
          RESPONSE=$(curl -s --max-time 15 -w "\n%{http_code}" -X GET \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deployment triggered successfully!"
          else
            echo "Coolify trigger failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}

      - name: Deploy triggered
        run: echo "Coolify deployment triggered successfully. Monitor at $COOLIFY_URL"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}

      - name: Health check
        run: |
          echo "Waiting 30s for deploy to start, then checking CRM readiness..."
          sleep 30
          RETRIES=5
          DELAY=10
          for i in $(seq 1 $RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://arcanpainting.ca/api/health)
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "CRM readiness check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/$RETRIES: HTTP $HTTP_CODE, retrying in ${DELAY}s..."
            sleep $DELAY
          done
          echo "Health check failed after $RETRIES attempts"
          exit 1
