name: Deployment disabled - Hostinger shared hosting

# Arcan production is managed on Hostinger shared hosting.
# Automatic GitHub-to-Coolify deployment is retired. Keep CI in ci.yml.
# This workflow deliberately has no push trigger and no deployment credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual release policy
        run: echo "Deployment is disabled in GitHub Actions. Use the reviewed Hostinger shared-hosting release procedure."
