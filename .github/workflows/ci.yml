name: CI Build

# Build-only workflow for Arcan-Painting (React Router v7 framework).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run
        env:
          CI: true

      - name: Install Chromium for smoke tests
        if: github.actor != 'dependabot[bot]'
        run: npx playwright install --with-deps chromium

      - name: Public smoke tests
        if: github.actor != 'dependabot[bot]'
        run: npm run test:e2e
        env:
          CI: true
