version: '3.8'

services:
  openclaw:
    image: ghcr.io/camster91/openclaw:latest
    container_name: arcan-openclaw
    restart: unless-stopped
    ports:
      - "18790:18789"
    volumes:
      - ./workspace:/app/workspace
      - ./config:/app/config
    environment:
      - NODE_ENV=production
      - PORT=18789
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-PLACEHOLDER}
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=google/gemini-3.1-flash-lite-preview
      - AI_FALLBACK_PROVIDER=moonshot
      - AI_FALLBACK_MODEL=moonshot-v1-8k
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-PLACEHOLDER}
    networks:
      - arcan-net

networks:
  arcan-net:
    driver: bridge
